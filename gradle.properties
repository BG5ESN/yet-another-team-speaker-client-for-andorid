android.useAndroidX=true
android.enableJetifier=true
# 本机已于 2026-09 从 8G 升到 32G：解除当年为 8G/零 swap 设的限流
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.vfs.watch=false

# —— 网络兜底（本机直连 maven.google.com 不通，走局域网代理 192.168.1.210:20173）——
# 国内镜像（阿里云/腾讯/华为）保持直连，其余走代理
systemProp.http.proxyHost=192.168.1.210
systemProp.http.proxyPort=20173
systemProp.https.proxyHost=192.168.1.210
systemProp.https.proxyPort=20173
systemProp.http.nonProxyHosts=localhost|127.0.0.1|192.168.1.*|*.aliyun.com|*.tencent.com|*.huaweicloud.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|192.168.1.*|*.aliyun.com|*.tencent.com|*.huaweicloud.com

# Kotlin 编译在 Gradle 进程内完成，避免 Kotlin daemon 连接问题
kotlin.compiler.execution.strategy=in-process

# 网络超时收紧：避免卡在不通的地址上长时间挂起
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000