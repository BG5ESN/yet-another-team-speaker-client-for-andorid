name: Android CI (Precompiled SO Build)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch: # 允许在 GitHub 页面上手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # 单元测试（46 条）：抖动缓冲时序、并发回归、消息解析、设备路由匹配等。
      # 放在打包前面 —— 测试挂了就不该产出 APK。
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -x buildRustLibs

      # 关键：用 -x 跳过上游的 Rust 编译任务。
      # 仓库里已提交了预编译好的 jniLibs/*/libtslib_jni.so（arm64-v8a / x86_64），
      # Gradle 会直接把它打进 APK —— 所以 CI 不需要 Rust 工具链。
      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug -x buildRustLibs

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3-Android-App
          path: app/build/outputs/apk/debug/app-debug.apk
